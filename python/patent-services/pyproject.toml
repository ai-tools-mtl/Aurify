[project]
name = "deepseek-harness-patent-services"
version = "0.1.2"
description = "MCP stdio server exposing patent disclosure parsing and export to the dsh patent profile"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1",
    "mcp>=1.2.0",
    "python-docx>=1.1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
patent-services = "patent_services.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_services"]

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
