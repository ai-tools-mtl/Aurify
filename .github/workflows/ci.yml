name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run patent-services test suite
        run: uv run --locked --project python/patent-services --group test pytest python/patent-services/tests -q

  # Full TS type checks and vitest require the compatible host monorepo.
  build-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: astral-sh/setup-uv@v4
      - run: npm --prefix scripts ci
      - run: npm --prefix scripts run build
      - run: uv build --out-dir dist python/patent-services
      - run: python3 scripts/prepare-release.py
      - run: python3 scripts/verify-dist.py --write-checksums
      - run: python3 scripts/verify-dist.py
      - name: Generated release files are not tracked
        run: test -z "$(git ls-files dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: aurify-release
          path: dist/
          if-no-files-found: error
